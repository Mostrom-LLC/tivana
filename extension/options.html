<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tivana Bridge Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #0f172a;
    }
    .section {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 120px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 2px rgba(14,165,233,0.2);
    }
    button {
      padding: 8px 16px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover { background: #0284c7; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.connected { background: #22c55e; }
    .dot.disconnected { background: #ef4444; }
    .tab-list {
      list-style: none;
      font-size: 13px;
    }
    .tab-list li {
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
    }
    .tab-list li:last-child { border-bottom: none; }
    .tab-url {
      color: #64748b;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-session {
      font-family: monospace;
      color: #0ea5e9;
      font-size: 12px;
    }
    .empty { color: #94a3b8; font-size: 13px; font-style: italic; }
    #saved {
      color: #22c55e;
      font-size: 13px;
      margin-left: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <h1>Tivana Bridge</h1>

  <div class="section">
    <h2>Connection</h2>
    <label for="port">Runtime Port</label>
    <input type="number" id="port" min="1" max="65535" value="9876">
    <button id="save">Save</button>
    <span id="saved">Saved!</span>
  </div>

  <div class="section">
    <h2>Status</h2>
    <div class="status" id="connectionStatus">
      <span class="dot disconnected" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="section">
    <h2>Attached Tabs</h2>
    <ul class="tab-list" id="tabList">
      <li class="empty">No tabs attached</li>
    </ul>
  </div>

  <script src="options.js"></script>
</body>
</html>
